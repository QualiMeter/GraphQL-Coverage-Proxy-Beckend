name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coverage_test
          POSTGRES_USER: coverage_test
          POSTGRES_PASSWORD: coverage_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coverage_test -d coverage_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://coverage_test:coverage_test_password@127.0.0.1:5432/coverage
      TEST_DATABASE_URL: postgresql+asyncpg://coverage_test:coverage_test_password@127.0.0.1:5432/coverage_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e '.[test]'

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate production deploy script
        run: bash -n deploy/vps/graphql-coverage-deploy.sh

      - name: Create isolated application database
        run: >-
          psql "postgresql://coverage_test:coverage_test_password@127.0.0.1:5432/coverage_test"
          -v ON_ERROR_STOP=1 -c "CREATE DATABASE coverage"

      - name: Verify database configuration and apply migrations
        run: |
          : "${TEST_DATABASE_URL:?TEST_DATABASE_URL must point to the job PostgreSQL service}"
          test "$DATABASE_URL" != "$TEST_DATABASE_URL"
          alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: Run unit tests
        run: python -m pytest -m "not integration" -v

      - name: Run PostgreSQL integration tests
        run: |
          : "${TEST_DATABASE_URL:?PostgreSQL integration tests must not be skipped}"
          python -m pytest -m integration -v -rs

  deploy:
    name: Deploy verified backend to VPS
    needs: backend
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: graphql-coverage-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment settings
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?Set DEPLOY_HOST GitHub Actions variable}"
          : "${DEPLOY_USER:?Set DEPLOY_USER GitHub Actions variable}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY GitHub Actions secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS GitHub Actions secret}"
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid DEPLOY_PORT"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid GITHUB_SHA"; exit 1; }

      - name: Install deploy SSH identity and verified host key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy tested commit using locked VPS script
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/graphql-coverage-deploy '$GITHUB_SHA'"
