[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graphql-coverage-test"
version = "0.1.0"
description = "pytest integration for GraphQL Coverage test executions"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
