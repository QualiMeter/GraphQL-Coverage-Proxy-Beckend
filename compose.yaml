services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coverage
      POSTGRES_USER: coverage
      POSTGRES_PASSWORD: coverage_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coverage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverage -d coverage"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://coverage:coverage_dev@db:5432/coverage
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  coverage-postgres-data:
