[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graphql-coverage-backend"
version = "0.1.0"
description = "GraphQL E2E request coverage backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy[asyncio]>=2.0,<2.2",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "graphql-core>=3.2,<3.4",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a PostgreSQL instance configured with TEST_DATABASE_URL"]
