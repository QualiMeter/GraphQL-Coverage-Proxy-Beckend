name: graphql-coverage

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      TARGET_GRAPHQL_URL: ${TARGET_GRAPHQL_URL:-}
      COVERAGE_API_KEY: ${COVERAGE_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # The '-' form uses the default only when unset; an explicit empty
      # API_ROOT_PATH is required when the API moves to its own subdomain.
      API_ROOT_PATH: ${API_ROOT_PATH-/coverage}
    ports:
      - "127.0.0.1:${API_PORT:-5081}:8000"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path \"$$API_ROOT_PATH\""]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
