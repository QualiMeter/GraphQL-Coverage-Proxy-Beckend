# Include inside EACH proxied location in the TLS server for graphql.rebyte.fun.
# HTTP listener redirects to HTTPS and must not proxy auth writes.
# Host Nginx -> loopback published Docker port -> API container.
proxy_pass http://127.0.0.1:5081;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# Replace client input; never use $http_x_forwarded_proto or append untrusted XFF.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_redirect off;
# Do not retry a GraphQL mutation on another upstream after it may have executed.
proxy_next_upstream off;
proxy_cache off;
