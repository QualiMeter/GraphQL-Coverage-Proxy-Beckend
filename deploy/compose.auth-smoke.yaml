# Isolated CI-only stack. Never combine with production Compose or deploy/.env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_smoke
      POSTGRES_USER: auth_smoke
      POSTGRES_PASSWORD: auth_smoke_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_smoke -d auth_smoke"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [backend]
  api:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_smoke:auth_smoke_test_only@db:5432/auth_smoke
      COVERAGE_API_KEY: auth-smoke-test-only-key-xxxxxxxxxxxxxxxxxxxxxxxx
      COVERAGE_PUBLIC_ORIGIN: https://graphql.rebyte.fun
      COVERAGE_DEV_MODE: "false"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?Set the isolated test bridge gateway}
      API_ROOT_PATH: ""
    ports: ["127.0.0.1::8000"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    command: ["sh", "-c", "python -m app.server --check-config && alembic upgrade head && exec python -m app.server"]
networks:
  backend:
    driver: bridge
